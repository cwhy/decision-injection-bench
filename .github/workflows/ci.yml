name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_reference.py
      - run: decision-injection-bench export --out /tmp/decision-cases.jsonl
      - run: decision-injection-bench simple export --out /tmp/simple-alias.jsonl
      - run: cmp /tmp/simple-alias.jsonl /tmp/decision-cases.jsonl
      - run: decision-injection-bench comprehensive plan --defenses strict --orders normal --repeats 1 --out /tmp/v2-plan.json
      - run: decision-injection-bench comprehensive search --method beam --backend jev --budget 32 --max-calls 4608 --dry-run --out /tmp/no-live-calls
      - run: python scripts/audit_comprehensive.py
